<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,minimum-scale=1,width=device-width" />
    <meta name="robots" content="noindex" />
    <title>Password required</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0 auto;
        max-width: 30rem;
        padding: 3rem 1rem;
      }

      p {
        white-space: pre-line;
      }

      input,
      button {
        box-sizing: border-box;
        display: block;
        font: inherit;
        margin-top: 0.5rem;
        padding: 0.5rem;
        width: 100%;
      }

      .error {
        color: #c00;
      }
    </style>
  </head>
  <body>
    <h1>This app is password protected</h1>
    {{#message}}
    <p>{{ message }}</p>
    {{/message}}
    <form method="post">
      <label for="password">Password</label>
      <input
        autocomplete="current-password"
        autofocus
        id="password"
        name="password"
        required
        type="password"
      />
      {{#error}}
      <p class="error">The password is incorrect.</p>
      {{/error}}
      <button type="submit">Continue</button>
    </form>
  </body>
</html>
