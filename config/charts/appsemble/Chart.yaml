apiVersion: v2
name: appsemble
version: 0.38.0
appVersion: 0.38.0
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: postgresql
    version: 16.7.27
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: mailpit
    version: 0.36.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: minio
    version: 14.10.5
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
  - name: valkey
    version: 0.11.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Block(pdf-viewer): Add url property to load files from assets or
        directly from a source."
    - kind: added
      description: "App: Add start and end pages to loop pages."
    - kind: added
      description: "App: Add configurable grid breakpoints via layout.breakpoints."
    - kind: added
      description: "App: Add responsive navbar grid layouts."
    - kind: added
      description: "App: Use CSS custom properties as responsive grid spacing units."
    - kind: added
      description: "Cli: Warn when the server version does not match the CLI version."
    - kind: added
      description: "Lang-sdk: Add layout.breakpoints to configure responsive grid breakpoints."
    - kind: added
      description: "Lang-sdk: Add responsive navbar grid layout definitions."
    - kind: added
      description: "Lang-sdk: Allow CSS custom properties as responsive grid spacing units."
    - kind: added
      description: "Server: Reject an app update when existing resources would no
        longer satisfy a changed resource schema, or when a resource type with data
        is removed from the app."
    - kind: added
      description: "Server: Support HEAD requests to the API root."
    - kind: changed
      description: "Block(form): Load the markdown editor only when a form contains a
        markdown field."
    - kind: changed
      description: "App: Check the Appsemble version using a HEAD request."
    - kind: fixed
      description: "Block(form): Allow selecting the exact minimum and maximum dates
        in date fields."
    - kind: fixed
      description: "App: Keep the app navigation layout on pages listed under the
        profile dropdown."
    - kind: fixed
      description: "App: Prevent session restoration while logging out."
    - kind: fixed
      description: "Cli: Bound server version checks and fall back to GET for servers
        without HEAD support."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
