apiVersion: v2
name: appsemble
version: 0.37.6
appVersion: 0.37.6
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: postgresql
    version: 16.7.27
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: mailpit
    version: 0.35.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: minio
    version: 14.10.5
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
  - name: valkey
    version: 0.11.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Utils: Support reporting resource paths for serialized assets."
    - kind: changed
      description: "Block(table): Set scrollable to true by default."
    - kind: changed
      description: "Server: Stop cleaning up unresolved custom domains during deployments."
    - kind: changed
      description: "Studio: In the app editor, turn the Publish button into a loader
        while it's busy publishing."
    - kind: fixed
      description: "Block(cards): Remove the reset event listener when the cards block
        unmounts."
    - kind: fixed
      description: "React-components: Render validation errors for file upload fields."
    - kind: fixed
      description: "Studio: Align documentation anchors consistently before headings."
    - kind: fixed
      description: "Studio: Show resource validation errors below their corresponding fields."
    - kind: fixed
      description: "Webpack-core: Stop Sass from emitting a byte order mark that
        invalidates a bundled CSS rule."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
