apiVersion: v2
name: appsemble
version: 0.40.0
appVersion: 0.40.0
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.47.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Block(action-button): Support icon:<key> references to custom app
        icons in the icon parameter."
    - kind: added
      description: "Block(button-list): Support icon:<key> references to custom app
        icons in the icon parameter of buttons."
    - kind: added
      description: "Block(cards): Support icon:<key> references to custom app icons in
        button and dropdown icons."
    - kind: added
      description: "Block(control-buttons): Support icon:<key> references to custom
        app icons in the back.icon and forward.icon parameters."
    - kind: added
      description: "Block(detail-viewer): Support icon:<key> references to custom app
        icons in string field icons."
    - kind: added
      description: "Block(feed): Support icon:<key> references to custom app icons in
        dropdown and dropdown option icons."
    - kind: added
      description: "Block(filter): Support icon:<key> references to custom app icons
        in the icon parameters."
    - kind: added
      description: "Block(footer): Support icon:<key> references to custom app icons
        in button icons."
    - kind: added
      description: "Block(form): Support icon:<key> references to custom app icons in
        field and button icons."
    - kind: added
      description: "Block(list): Support icon:<key> references to custom app icons in
        button, dropdown and field icons."
    - kind: added
      description: "Block(stats): Support icon:<key> references to custom app icons in
        the icon parameter of fields."
    - kind: added
      description: "Block(table): Support icon:<key> references to custom app icons in
        button and dropdown icons."
    - kind: added
      description: "Block(tiles): Support icon:<key> references to custom app icons in
        the icon parameter."
    - kind: added
      description: "App: Render custom icons from the app’s icons registry in the
        navigation, login buttons, and blocks."
    - kind: added
      description: "Block-interaction-tests: Add resolveIcon and icon to the default
        block utils."
    - kind: added
      description: "Cli: Emit the icon schema format for block parameters typed as
        IconReference."
    - kind: added
      description: "Lang-sdk: Add the icons registry and icon:<key> references for
        custom SVG icons."
    - kind: added
      description: "Node-utils: Add a socketTimeout option to initS3Client that fails
        and retries a request whose connection goes idle."
    - kind: added
      description: "Preact-components: Render icon:<key> references to custom icons in
        the Icon component."
    - kind: added
      description: "React-components: Add the IconProvider component and render
        icon:<key> references in the Icon component."
    - kind: added
      description: "Sdk: Add the utils.icon and utils.resolveIcon block utilities for
        rendering icon references."
    - kind: added
      description: "Sdk: Export the IconReference, IconRegistry, and IconRegistryEntry types."
    - kind: added
      description: "Server: Add pgbouncer.replicaCount to run several PgBouncer
        replicas, spread across nodes and guarded by a PodDisruptionBudget, which
        share the pgbouncer.maxUserConnections budget."
    - kind: added
      description: "Server: Add the APP_VALIDATION_FAILED code to app validation error
        responses."
    - kind: added
      description: "Server: Alert organization owners about failed client-credentials
        token requests."
    - kind: added
      description: "Server: Mount a scratch volume of backups.tmpSizeLimit (default
        8Gi) at /tmp on the backup-production-data CronJob to hold each dump until
        it is uploaded."
    - kind: added
      description: "Server: Reject app updates which remove an icon key used by an
        OAuth2 or SAML secret."
    - kind: added
      description: "Server: Validate icon:<key> references in OAuth2 and SAML secrets
        against the app’s icons registry."
    - kind: added
      description: "Studio: Document custom icons and the utils.icon block utility."
    - kind: added
      description: "Studio: Document running PostgreSQL for Appsemble with
        CloudNativePG, including high availability, backups and the move from the
        bundled chart."
    - kind: added
      description: "Studio: Render custom icons from the app’s icons registry in the
        app secrets pages."
    - kind: added
      description: "Studio: Show server validation errors for SSO secrets and app
        definition publishing."
    - kind: added
      description: "Studio: Show the last failed token request of a service secret on
        the app secrets page."
    - kind: added
      description: "Types: Add the APP_VALIDATION_FAILED error code constant."
    - kind: added
      description: "Web-utils: Add icon resolution, sizing, and DOM rendering
        utilities for custom icons."
    - kind: changed
      description: "Lang-sdk: Accept icon:<key> references in the icon of pages."
    - kind: changed
      description: "Preact-components: Accept icon:<key> references in the icon prop
        of Button, Dropdown, FormComponent, IconCheckbox and RadioButton."
    - kind: changed
      description: "Sdk: Accept icon:<key> references in the icon of block menu items."
    - kind: changed
      description: "Server: Dump each database to a file in backup-production-data
        before uploading it, so a retried upload does not run pg_dump again and
        pg_dump never waits on the network."
    - kind: changed
      description: "Server: Fail a backup upload part in backup-production-data after
        a minute without socket activity instead of waiting for the TCP timeout."
    - kind: changed
      description: "Server: Limit backup-production-data to two reruns, a six hour
        deadline and one Job at a time on its CronJob."
    - kind: changed
      description: "Studio: Generate home instead of a Font Awesome class string as
        the example for icon parameters."
    - kind: changed
      description: "Types: Type the icon of SSO secrets as an icon reference."
    - kind: changed
      description: "Utils: Use the icon format for the OAuth2 and SAML secret icon schemas."
    - kind: removed
      description: 'Server: Remove the bundled Bitnami PostgreSQL dependency chart.
        The chart connects to an existing PostgreSQL 17 server through
        postgresql.host, postgresql.port and postgresql.auth, which replace
        global.postgresql.auth and postgresql.fullnameOverride; CloudNativePG is the
        documented way to run it. The upgrade removes the PostgreSQL StatefulSet
        from the release, so move the data across first: the PostgreSQL deployment
        documentation describes the migration under "Moving from the bundled
        PostgreSQL chart".'
    - kind: fixed
      description: "Block(form): Report markdown field edits immediately so a quick
        submit sees the typed text."
    - kind: fixed
      description: "Server: Assign the selected role when adding a new demo member to
        existing groups."
    - kind: fixed
      description: "Server: Include soft-deleted apps in migrate,
        backup-production-data and restore-data-from-backup, so an app restored
        within the retention period runs on the current schema and is in the
        backups."
    - kind: fixed
      description: "Server: Retry each database dump in backup-production-data and
        stop pg_dump and the upload cleanly when the other side fails."
    - kind: security
      description: "Server: Allow logging in with an unverified email, so users who
        lost the verification email can resend it from the studio."
    - kind: security
      description: "Server: Reject a replayed TOTP code as already used without
        counting it towards the lockout."
