apiVersion: v2
name: appsemble
version: 0.38.1
appVersion: 0.38.1
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: postgresql
    version: 16.7.27
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: mailpit
    version: 0.36.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: minio
    version: 14.10.5
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Server: Support the organizations:delete client credentials scope
        on organization deletion."
    - kind: changed
      description: "Server: Serve SVG app assets unmodified and sandboxed against
        embedded scripts."
    - kind: fixed
      description: "App: Keep a tabs page from re-running its onLoad action and
        re-emitting the tab list on every tab switch."
    - kind: fixed
      description: "Cli: Publish seed resources atomically and report replacement failures."
    - kind: fixed
      description: "Cli: Upload app screenshots directly instead of copying them to a
        temporary file in the app directory."
    - kind: fixed
      description: "Lang-sdk: Support loop grid layouts during block schema generation."
    - kind: fixed
      description: "Node-utils: Handle !important correctly in app variant style patches."
    - kind: fixed
      description: "Server: Replace seed resources transactionally and serialize
        concurrent seed deletion."
    - kind: fixed
      description: "Server: Support HEIC image assets in the Debian Docker image."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
