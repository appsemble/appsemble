apiVersion: v2
name: appsemble
version: 0.41.4
appVersion: 0.41.4
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.48.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.1
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Server: Add verified domains and operator declarations for Studio
        SSO discovery."
    - kind: changed
      description: "Studio: Discover organization single sign-on from email before
        password sign-in."
    - kind: fixed
      description: "App: Stop sending session cookies with requests to other origins."
    - kind: fixed
      description: "React-components: Label password visibility controls for assistive
        technology."
    - kind: fixed
      description: "Server: Delete the TLS secret of a domain when its ingress is deleted."
    - kind: fixed
      description: "Server: Disable organization single sign-on when the organization
        is deleted."
    - kind: fixed
      description: "Server: Do not accept an organization SSO authentication time
        later than the current time."
    - kind: fixed
      description: "Service-worker: Refresh stored stylesheets of password protected
        apps when online."
    - kind: fixed
      description: "Studio: Keep the new session when signing in with other Studio tabs open."
    - kind: fixed
      description: "Studio: Send signed-in users to the apps page when a register or
        password page link points outside Studio."
    - kind: security
      description: "Server: Expire access to password protected apps 3 days after the
        password is entered."
    - kind: security
      description: "Server: Keep visitors on the app after they enter the app password."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
