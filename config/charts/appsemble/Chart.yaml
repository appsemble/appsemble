apiVersion: v2
name: appsemble
version: 0.40.13
appVersion: 0.40.13
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.48.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.1
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "App: Add an opt-in page not found page through notFoundPage."
    - kind: added
      description: "Cli: Add --password option to app publish, app update, and app patch."
    - kind: added
      description: "Lang-sdk: Add the notFoundPage property to the app definition."
    - kind: added
      description: "Server: Accept a password when creating an app."
    - kind: changed
      description: "Server: Show the password page message from the
        server.passwordPage.message app translation."
    - kind: removed
      description: "Server: Remove the passwordMessage app property."
    - kind: removed
      description: "Studio: Remove the password page message setting, translate
        server.passwordPage.message instead."
    - kind: fixed
      description: "Server: A failing app cron job no longer skips the remaining cron
        jobs of that app."
    - kind: fixed
      description: "Server: Convert XML responses of server-side request actions that
        define a schema."
    - kind: fixed
      description: "Studio: Fix the Studio app settings and translations pages
        crashing on an app language such as ang."
    - kind: security
      description: "Server: Rate limit password attempts on password protected apps."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
