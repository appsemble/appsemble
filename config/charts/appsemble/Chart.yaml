apiVersion: v2
name: appsemble
version: 0.40.3-test.3
appVersion: 0.40.3-test.3
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.47.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "App: Show page icons in breadcrumbs."
    - kind: fixed
      description: "Node-utils: Sign a multi-object delete with Content-MD5 again, so
        deleting assets works against object stores from before the S3 flexible
        checksums, such as the MinIO builds self-hosted installations still run."
    - kind: fixed
      description: "Preact-components: Show a danger-colored X icon for error messages."
    - kind: fixed
      description: "React-components: Show a danger-colored X icon for error messages."
    - kind: fixed
      description: "Server: Generate the self-signed PgBouncer certificate in each
        PgBouncer pod instead of in a rendered Secret, which changed on every render
        under ArgoCD and kept the application out of sync."
    - kind: fixed
      description: "Server: Let PgBouncer retry a failed server login after 1 second
        instead of 15, so a PostgreSQL switchover or failover no longer fails
        requests for 15 seconds."
    - kind: fixed
      description: "Server: Name the server PodDisruptionBudget <release>-server, so
        it no longer collides with the one CloudNativePG creates for a Cluster named
        after the release."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
