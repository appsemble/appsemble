apiVersion: v2
name: appsemble
version: 0.42.0
appVersion: 0.42.0
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.48.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.1
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Server: Add organization service accounts for CI and other
        non-interactive clients."
    - kind: added
      description: "Server: Record the provider account of organization single sign-on
        identities at each sign-in."
    - kind: added
      description: "Server: Return the identity provider end session URL when logging
        out of organization single sign-on."
    - kind: added
      description: "Studio: Create and revoke organization service accounts on the
        members page."
    - kind: added
      description: "Studio: Show the provider account of linked organization single
        sign-on identities."
    - kind: added
      description: "Studio: Sign out at the identity provider when signing out of
        organization single sign-on."
    - kind: changed
      description: "Server: Provision a service account with credentials from the
        provision.existingSecret Secret."
    - kind: fixed
      description: "E2e: Wait for the OAuth2 callback in loginAppAppsembleOAuth
        without a redirect."
    - kind: fixed
      description: "Server: Do not create a second account when the email typed at
        sign-in belongs to an existing account."
    - kind: fixed
      description: "Server: Generate invoice PDFs faster and 20 times smaller."
    - kind: fixed
      description: "Server: Keep personal client credentials from organization SSO
        working after signing out."
    - kind: fixed
      description: "Server: Keep the apps of an organization when deleting the
        organization fails."
    - kind: fixed
      description: "Server: List the connected apps of a user without opening the
        database of every app."
    - kind: fixed
      description: "Server: Serve app requests without serializing the app definition to YAML."
    - kind: fixed
      description: "Studio: Authorize personal client credentials of an organization
        SSO account at the identity provider."
    - kind: fixed
      description: "Studio: Let Owners sign in again at the provider to change single
        sign-on settings."
    - kind: fixed
      description: "Studio: Show email verification success to signed-out users."
    - kind: fixed
      description: "Studio: Show the connected apps in the user settings again."
    - kind: fixed
      description: "Studio: Show the creation date of personal client credentials."
    - kind: fixed
      description: "Studio: Stay signed out when the session ends while Studio loads the user."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
