apiVersion: v2
name: appsemble
version: 0.40.6
appVersion: 0.40.6
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.48.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "E2e: Add mailpit fixture allowing you to communicate with the
        Mailpit API using the mailpit-api package."
    - kind: added
      description: "Lang-sdk: Add theme.displayFont: a display face next to the body
        face in theme.font. Both families are emitted on :root as --font-family and
        --font-family-display."
    - kind: added
      description: "Preact-components: Expose slider progress to themes as the
        --slider-progress CSS custom property."
    - kind: changed
      description: "E2e: Change scope of the giveAppConsent fixture to include all
        possible scopes."
    - kind: changed
      description: "Preact-components: Focus the first focusable element of a modal
        when it opens."
    - kind: changed
      description: "Preact-components: Render modals as native dialog elements on top
        of the page."
    - kind: changed
      description: "React-components: Focus the first focusable element of a modal
        when it opens instead of the modal itself."
    - kind: changed
      description: "React-components: Render modals as native dialog elements on top
        of the page."
    - kind: fixed
      description: "Block(barcode-scan): Label the selects, announce scanned codes and
        show a focus ring."
    - kind: fixed
      description: "Block(cards): Announce errors and empty results, name footer
        buttons and render links as links."
    - kind: fixed
      description: "Block(data-notifier): Announce new data and hide the collapsed
        refresh button."
    - kind: fixed
      description: "Block(feed): Name the avatar, its status and the reply controls,
        and show an avatar focus ring."
    - kind: fixed
      description: "Block(filter): Label fields, date ranges and the open button, and
        expose list state."
    - kind: fixed
      description: "Block(form): Name fields and buttons, expose expanded state and
        announce long submissions."
    - kind: fixed
      description: "Block(list): Make item title and field controls at least 24 by 24 pixels."
    - kind: fixed
      description: "Block(list): Render items as plain text without a pointer cursor
        when the list has no click action."
    - kind: fixed
      description: "App: Explain invalid or already used email verification links on
        the verify page."
    - kind: fixed
      description: "App: Show page error recovery when a block script fails to load."
    - kind: fixed
      description: "App: Show page error recovery when a block stylesheet fails to load."
    - kind: fixed
      description: "Node-utils: Reserve infrastructure host names for organization identifiers."
    - kind: fixed
      description: "React-components: Fade in and announce a message assertively only
        once when a modal opens or closes."
    - kind: fixed
      description: "React-components: Hide the links of the closed side menu from
        keyboard and screen reader users."
    - kind: fixed
      description: "React-components: Show messages on top of open modals."
    - kind: fixed
      description: "Server: Fix organization DNS and stagger wildcard certificate renewals."
    - kind: fixed
      description: "Server: Keep no organization when creating it fails, so the same
        id can be used again."
    - kind: fixed
      description: "Server: Preserve app controller fields omitted from app updates."
    - kind: fixed
      description: "Studio: Explain invalid or already used email verification links
        on the verify page."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
