apiVersion: v2
name: appsemble
version: 0.42.1
appVersion: 0.42.1
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.48.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.1
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Cli: Add --domain to app publish and app update."
    - kind: added
      description: "Cli: Set the app domain from the domain field of an
        .appsemblerc.yaml context."
    - kind: added
      description: "Server: Add an endpoint for organization members to reset the TOTP
        of an app member."
    - kind: added
      description: "Studio: Show the TOTP status of app members and let organization
        members reset it."
    - kind: fixed
      description: "App: Fix completing TOTP on apps with a custom Login page."
    - kind: fixed
      description: "React-components: Clear the timeout of a confirmation dialog on unmount."
    - kind: fixed
      description: "Server: Accept null for nullable file properties and delete the
        asset it replaces."
    - kind: fixed
      description: "Server: Allow updating app members who have properties that were
        removed from the app."
    - kind: fixed
      description: "Server: Answer an error if updating the profile of an app member fails."
    - kind: fixed
      description: "Server: Clear optional resource properties, including files, set
        to null in a patch."
    - kind: fixed
      description: "Server: Fix companion containers in the Helm chart when ingress is
        disabled."
    - kind: fixed
      description: "Server: Fix updating app members using SCIM."
    - kind: fixed
      description: "Server: Keep the custom properties of an app member on password
        reset and change."
    - kind: fixed
      description: "Server: Keep the files of properties a resource patch leaves out."
    - kind: fixed
      description: "Server: Only accept ephemeral resources in app member properties
        of demo apps."
    - kind: security
      description: "Server: Reject used pending TOTP tokens when starting TOTP setup."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
