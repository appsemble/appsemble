apiVersion: v2
name: appsemble
version: 0.40.16
appVersion: 0.40.16
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.48.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.1
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Appsemble-language-server: Complete role names in page roles."
    - kind: added
      description: "Server: Add public GET /api/subscription-plans endpoint listing
        the subscription plans."
    - kind: added
      description: "Studio: Add subscribe page to choose an organization for a
        subscription plan."
    - kind: changed
      description: "Studio: Use PostgreSQL 18 in the Docker Compose docs; dump and
        restore existing data."
    - kind: fixed
      description: "App: Restore the missing link text in the German permissions error."
    - kind: fixed
      description: "Studio: Restore the missing link text in translated messages."
    - kind: security
      description: "Server: Update the PostgreSQL client tools in the Docker image to 18.7."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
