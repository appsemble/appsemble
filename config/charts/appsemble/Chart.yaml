apiVersion: v2
name: appsemble
version: 0.37.5
appVersion: 0.37.5
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: postgresql
    version: 16.7.27
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: mailpit
    version: 0.35.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: minio
    version: 14.10.5
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
  - name: valkey
    version: 0.11.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Block(detail-viewer): Add an HD download control to image previews."
    - kind: added
      description: "Block(feed): Add an HD download control to image previews."
    - kind: added
      description: "Block(footer): Add an HD download control to image previews."
    - kind: added
      description: "Block(form): Add an HD download control to image file previews."
    - kind: added
      description: "Block(image): Add an HD download control to fullscreen image previews."
    - kind: added
      description: "Block(table): Add an HD download control to image previews."
    - kind: added
      description: "App: Expose the page grid spacing unit as a CSS custom property."
    - kind: added
      description: "Preact-components: Add an HD download control to image previews."
    - kind: added
      description: "Server: Allow app members to download original app assets."
    - kind: changed
      description: "Block(form): Remove ImageSizeSteps option from the Image parameter
        in favor of the generic number option."
    - kind: changed
      description: "Block(list): Remove ImageSizeSteps option from the Image parameter
        in favor of the generic number option."
    - kind: changed
      description: "Preact-components: Remove ImageSizeSteps option from
        ImageComponent in favor of the generic number option."
    - kind: fixed
      description: "Block(form): Block form submission while validation actions are pending."
    - kind: fixed
      description: "Cli: Resolve Webpack loaders and default PostCSS plugins from the
        Appsemble CLI, making a PostCSS config in the served project optional."
    - kind: fixed
      description: "Cli: Resolve asset() functions in app styles served by appsemble
        serve, like the Appsemble server does."
    - kind: fixed
      description: "Cli: The development server (appsemble serve) reflects the request
        origin in CORS responses, so credentialed app requests such as
        /api/apps/:id/variables no longer fail against the wildcard."
    - kind: fixed
      description: "Studio: Download app assets through authenticated Studio requests."
    - kind: fixed
      description: "Studio: Hide organization billing tabs from non-members."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
