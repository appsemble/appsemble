apiVersion: v2
name: appsemble
version: 0.41.1
appVersion: 0.41.1
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.48.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.1
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Server: Allow app requests to internal host names with the
        ssrfAllowIpAddressList Helm value."
    - kind: added
      description: "Server: Reject service, OAuth2 and SCIM secrets without a value,
        and list them as app warnings."
    - kind: added
      description: "Studio: List the app secrets that need a value at the top of the app pages."
    - kind: changed
      description: "Preact-components: Set the Loader test id through its testId prop."
    - kind: removed
      description: "Server: Remove the unused react-components messages from app core messages."
    - kind: fixed
      description: "Block(table): Show the dropdown label only as an accessible name
        when the dropdown has an icon."
    - kind: fixed
      description: "Cli: Keep app secrets and variables without a file in config on app update."
    - kind: fixed
      description: "Server: Check permissions before updating app SSL secrets."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
