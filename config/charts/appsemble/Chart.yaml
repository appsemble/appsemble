apiVersion: v2
name: appsemble
version: 0.40.5
appVersion: 0.40.5
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.48.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Block(button-list): Add data-driven pressed state for toggle buttons."
    - kind: added
      description: "Block(footer): Render the copyright as a link when its remapper
        returns a label and link."
    - kind: added
      description: "Block(form): Add autocomplete to string and number fields to set
        the HTML autocomplete attribute."
    - kind: added
      description: "Block(form): Add errorSummaryPosition to list every invalid field
        at the top of the form."
    - kind: added
      description: "Block(form): Add helpPosition to show help and errors between the
        label and the input."
    - kind: added
      description: "Block(form): Add labelTextFormat: markdown to render boolean field
        label text as Markdown."
    - kind: added
      description: "Block(table): Add alt to image fields."
    - kind: added
      description: "Cli: Delete app variant message keys patched to null."
    - kind: added
      description: "E2e: Add scanAppAccessibility fixture to score app accessibility
        with axe-core."
    - kind: added
      description: "Preact-components: Add FormComponentHelpPositionContext to render
        help above form controls."
    - kind: changed
      description: "App: Leave app definition validation out of the app bundle, which
        makes it a third smaller."
    - kind: changed
      description: "App: Preload the font stylesheet and the app messages from the HTML."
    - kind: changed
      description: "Lang-sdk: Prefix prototype property names with # in the xml.parse remapper."
    - kind: fixed
      description: "Block(cards): Open cards with the keyboard."
    - kind: fixed
      description: "Block(form): Disable the fields until the onLoad action has
        finished, so the loaded data does not overwrite user input."
    - kind: fixed
      description: "Block(form): Give the password visibility toggle an accessible name."
    - kind: fixed
      description: "Block(form): Label form selection dialogs and their choice controls."
    - kind: fixed
      description: "Block(form): Show and hide password fields that have a datalist."
    - kind: fixed
      description: "Block(form): Validate required and prohibited requirements of
        boolean fields."
    - kind: fixed
      description: "Block(list): Expose button titles as accessible names for list actions."
    - kind: fixed
      description: "Block(table): Sort columns and open clickable cells with the keyboard."
    - kind: fixed
      description: "App: Initialize blocks with the current viewport mode."
    - kind: fixed
      description: "App: Make the dialog action keyboard and screen reader accessible."
    - kind: fixed
      description: "App: Open mailto:, tel: and sms: links without leaving a blank tab behind."
    - kind: fixed
      description: "App: Render the repeated app name in the title bar as text, not a heading."
    - kind: fixed
      description: "App: Resolve tab.name to the opened tab, not the first tab, when
        the tab list loads as it opens."
    - kind: fixed
      description: "App: Show float blocks in a dialog on top of the dialog."
    - kind: fixed
      description: "Cli: Keep patching variant messages after a language without messages."
    - kind: fixed
      description: "Preact-components: Add accessible names and states to loaders,
        dropdowns, radio groups and sliders."
    - kind: fixed
      description: "Preact-components: Keep an open date picker open when its disabled
        dates are recalculated."
    - kind: fixed
      description: "React-components: Announce Loader to screen readers as a loading status."
    - kind: fixed
      description: "React-components: Make Modal and ModalCard accessible modal
        dialogs with focus management."
    - kind: security
      description: "Block(form): Update the markdown editor and KaTeX to patch a KaTeX
        trust bypass."
    - kind: security
      description: "Cli: Update postcss-preset-env to v10."
    - kind: security
      description: "Lang-sdk: Update fast-xml-parser to patch entity expansion vulnerabilities."
    - kind: security
      description: "Node-utils: Update webpack-dev-middleware to patch a path
        traversal vulnerability."
    - kind: security
      description: "Server: Escape HTML in the inline settings script of apps and the studio."
    - kind: security
      description: "Server: Update dependencies to patch known vulnerabilities."
    - kind: security
      description: "Webpack-config: Update css-minimizer-webpack-plugin to v8 to fix
        serialize-javascript advisories."
    - kind: security
      description: "Webpack-core: Update css-minimizer-webpack-plugin to v8 to fix
        serialize-javascript advisories."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
