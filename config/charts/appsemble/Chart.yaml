apiVersion: v2
name: appsemble
version: 0.40.4
appVersion: 0.40.4
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.48.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Block(list): Add collapseButton parameter to configure the
        collapsible list toggle button."
    - kind: added
      description: "Server: Support $top and $skip in server-side resource.query actions."
    - kind: changed
      description: "App: List the profile dropdown items in the collapsed top navigation menu."
    - kind: removed
      description: "Cli: Remove the appsemble serve development server."
    - kind: fixed
      description: "App: Wrap the email verification banner on narrow screens."
    - kind: fixed
      description: "Preact-components: Show keyboard focus rings and support
        --input-radius and --appsemble-placeholder-color."
    - kind: security
      description: "Block(form): Update prosemirror-view to fix XSS in clipboard paste
        handling."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
