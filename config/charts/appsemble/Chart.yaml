apiVersion: v2
name: appsemble
version: 0.37.4
appVersion: 0.37.4
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: postgresql
    version: 16.7.27
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: mailpit
    version: 0.34.1
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: minio
    version: 14.10.5
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
  - name: valkey
    version: 0.11.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: changed
      description: "Block(form): Add more size options to the image size parameter:
        auto, number and more steps (256, 512)."
    - kind: changed
      description: "Block(list): Add more size options to the image size parameter:
        auto, number and more steps (256, 512)."
    - kind: changed
      description: "Preact-components: Add more size options to ImageComponent: auto,
        number and more steps (256, 512)."
    - kind: changed
      description: "Server: Cascade delete app email quota logs when deleting an app."
    - kind: fixed
      description: "Block(form): Allow appending files to repeated file fields with
        existing assets."
    - kind: fixed
      description: "Node-utils: Follow system screen orientation settings in web app manifests."
    - kind: fixed
      description: "Server: Fix app member session loss during concurrent refreshes."
    - kind: fixed
      description: "Server: Keep patched demo resource assets reachable."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
