apiVersion: v2
name: appsemble
version: 0.40.3-test.0
appVersion: 0.40.3-test.0
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.47.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: added
      description: "Block(footer): Add the closeImage and enlargeImage messages."
    - kind: added
      description: "Block(footer): Add the enlarge image parameter to control whether
        images open an enlargement."
    - kind: added
      description: "Block(form): Add hideErrorSummary parameter to hide the summary of
        invalid fields."
    - kind: added
      description: "Block(form): Show a status icon in field errors."
    - kind: added
      description: "App: Add scroll action to scroll the page to the top or bottom."
    - kind: added
      description: "App: Lay out the built-in pages of an app as a responsive grid
        using layout.builtinPages."
    - kind: added
      description: "App: Place the resend banner and the bottom navigation in a page
        grid via reserved areas."
    - kind: added
      description: "Lang-sdk: Add layout.builtinPages to lay out the built-in pages of
        an app as a responsive grid."
    - kind: added
      description: "Lang-sdk: Add overrides to icon registry entries to replace
        built-in Font Awesome icons."
    - kind: added
      description: "Lang-sdk: Add scroll action definition."
    - kind: added
      description: "Lang-sdk: Add the resend-banner and bottom-navigation grid areas
        to page and built-in page layouts."
    - kind: added
      description: "Preact-components: Show status icons in messages and form field errors."
    - kind: added
      description: "React-components: Show status icons in messages and form field errors."
    - kind: added
      description: "Server: Roll back database migrations with the migrateImage.tag Helm value."
    - kind: added
      description: "Server: Serve layout.builtinPages to the app."
    - kind: added
      description: "Studio: Document bundled and external Valkey deployment."
    - kind: added
      description: "Studio: Show a status icon in field errors."
    - kind: changed
      description: "Block(form): Show the errors of untouched fields after a submit attempt."
    - kind: changed
      description: "Lang-sdk: Allow blocks to claim the breadcrumbs, resend-banner and
        bottom-navigation grid areas."
    - kind: changed
      description: "Server: Read the training catalog from bundled files without
        database synchronization."
    - kind: changed
      description: "Server: Retry Valkey connections with capped exponential backoff."
    - kind: changed
      description: "Server: Run database migrations in a dedicated Job."
    - kind: changed
      description: "Server: Run the Helm migrate Job before the Deployment rolls over,
        connected to PostgreSQL directly."
    - kind: removed
      description: "Cli: Remove the synchronize-trainings command."
    - kind: fixed
      description: "Block(barcode-scan): Name the image and camera scanner buttons for
        screen readers."
    - kind: fixed
      description: "Block(footer): Render footer content and actions correctly."
    - kind: fixed
      description: "Block(form): Name the remove file and reset location buttons for
        screen readers."
    - kind: fixed
      description: "Block(form): Show validation errors on selection and geocoordinates fields."
    - kind: fixed
      description: "Block(image): Name the change image control for screen readers."
    - kind: fixed
      description: "App: Align custom icons with their label in inline contexts."
    - kind: fixed
      description: "App: Keep the content of the built-in pages clear of the bottom navigation."
    - kind: fixed
      description: "App: Render the title bar on the built-in pages that were missing one."
    - kind: fixed
      description: "App: Stop a built-in page from applying the navigation of the page
        rendered before it."
    - kind: fixed
      description: "Preact-components: Align custom icons with their label in inline contexts."
    - kind: fixed
      description: "Web-utils: Align custom icons with their label in inline contexts."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
