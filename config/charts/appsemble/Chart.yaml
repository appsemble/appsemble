apiVersion: v2
name: appsemble
version: 0.40.7-node-brotli.0
appVersion: 0.40.7-node-brotli.0
kubeVersion: '>=1.21.0'
type: application
description: The open source low-code app building platform
icon: https://charts.appsemble.com/icon.svg
home: https://appsemble.com
keywords:
  - app
  - apps
  - appsemble
  - framework
  - low-code
  - lowcode
sources:
  - https://gitlab.com/appsemble/appsemble
  - https://gitlab.com/appsemble/charts
dependencies:
  - name: mailpit
    version: 0.37.0
    repository: https://jouve.github.io/charts
    condition: mailpit.enabled
  - name: seaweedfs
    version: 4.48.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
annotations:
  artifacthub.io/changes: >
    - kind: changed
      description: "Block(cards): Make the footer button icon optional and show button
        labels on mobile."
    - kind: fixed
      description: "Block(form): Stop smooth scrolling to a field when the user
        prefers reduced motion."
    - kind: fixed
      description: "Block(list): Stop smooth scrolling to the linked item when the
        user prefers reduced motion."
    - kind: fixed
      description: "App: Expose flow page progress and loading blocks to assistive technology."
    - kind: fixed
      description: "App: Keep app member sessions active when switching groups."
    - kind: fixed
      description: "App: Move focus to the page on navigation and flow step changes."
    - kind: fixed
      description: "App: Render the page name in the title bar as the H1."
    - kind: fixed
      description: "App: Shorten transitions and stop smooth scrolling when the user
        prefers reduced motion."
  artifacthub.io/license: LGPL-3.0-only
  artifacthub.io/links: |
    - name: Appsemble Studio
      url: https://appsemble.app
    - name: Documentation
      url: https://appsemble.app/docs
    - name: support
      url: https://gitlab.com/appsemble/appsemble/-/issues
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/container/appsemble/appsemble
    - url: https://artifacthub.io/packages/helm/cert-manager/cert-manager
    - url: https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
  artifacthub.io/signKey: |
    fingerprint: C4EE8EE8B16EE94FEA3B0A7C346FF2248F310B53
    url: https://gitlab.com/appsemble-bot.gpg
