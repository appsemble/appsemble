# yaml-language-server: $schema=values.schema.json
replicaCount: 1

# The grace period must cover the preStop sleep plus the longest request.
preStopSleepSeconds: 10
terminationGracePeriodSeconds: 40

image:
  repository: appsemble/appsemble
  tag: null
  pullPolicy: IfNotPresent

nameOverride: ''
fullnameOverride: ''

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '1G'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/hsts: 'true'
    nginx.ingress.kubernetes.io/hsts-include-subdomains: 'true'
    nginx.ingress.kubernetes.io/hsts-max-age: '31536000'
    nginx.ingress.kubernetes.io/limit-rps: '400'
    nginx.ingress.kubernetes.io/limit-connections: '150'
  host: ''
  tls: false
  tlsSecretName: ''
  tlsWildcardSecretName: ''

s3:
  bucket: ''
  region: us-east-1
  pathStyle: true

dns:
  provider: ''
  zone: ''
  secret: ''
  targets: []

blockAssets:
  publicUrl: ''
  migration:
    enabled: true
    batch: 100

# OpenShift Route configuration (alternative to Ingress)
route:
  enabled: false
  host: ''
  annotations: {}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  deployment:
    limits:
      memory: 4Gi
      cpu: '2'
    requests:
      memory: 2Gi
      cpu: 500m
  jobs:
    limits:
      memory: 2Gi
      cpu: '1'
    requests:
      memory: 512Mi
      cpu: 250m
  cronjobs:
    limits:
      memory: 2Gi
      cpu: '2'
    requests:
      memory: 512Mi
      cpu: 250m
  backupCronjob:
    limits:
      memory: 4Gi
      cpu: '2'
    requests:
      memory: 1Gi
      cpu: 500m

nodeSelector: {}

tolerations: []

affinity: {}

smtpSecret: smtp

imapSecret: imap

adminApiSecret: admin-api-secret

sentry: null

oauthSecret: null

secretSecret: appsemble

stripeApiSecretKey: stripe-api-secret-key

stripeWebhookSecret: stripe-webhook-secret

cronjob:
  # Deploy the app cron runner and generic maintenance CronJobs. Every install needs these,
  # so this is independent of how the app is exposed (ingress or route).
  enabled: true
  platform:
    # Deploy the SaaS-only CronJobs (subscription billing, production backup, container scaling).
    enabled: true
  jobsHistoryLimit: 3
  # Delete finished (Complete or Failed) Job objects this many seconds after they finish, so
  # cronjob runs do not accumulate indefinitely across releases. 86400 = 1 day.
  ttlSecondsAfterFinished: 86400

gitlab:
  app: null
  env: null

migrateTo: null

skipCustomDomains: false

migrateDefinitions:
  validate: true
  save: false
  batch: 100

forceProtocolHttps: false

proxy: false

# The PostgreSQL server Appsemble connects to. The chart does not bundle PostgreSQL; run it with
# CloudNativePG (https://appsemble.app/docs/deployment/postgresql) and point host at the -rw
# service of the Cluster.
postgresql:
  host: appsemble-postgresql-rw
  port: 5432
  auth:
    # A kubernetes.io/basic-auth secret with username and password, as CloudNativePG creates it for
    # the owner of the application database.
    existingSecret: appsemble-postgresql-app
    username: appsemble
    database: appsemble
    secretKeys:
      userPasswordKey: password

postgresSSL: true

databaseBenchmark: true
slowQueryThreshold: 100
appServingCacheTtl: 300

pgbouncer:
  # Requires the pgbouncer.auth.existingSecret userlist secret to exist before enabling.
  enabled: false
  # Above 1, the replicas spread across nodes and a PodDisruptionBudget keeps one available.
  replicaCount: 1
  image:
    repository: edoburu/pgbouncer
    tag: v1.25.2-p0
    pullPolicy: IfNotPresent
  service:
    port: 6432
  auth:
    existingSecret: pgbouncer-userlist
    userlistKey: userlist.txt
    type: scram-sha-256
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  tls:
    autoGenerated: true
    existingSecret: ''
    client:
      sslmode: require
      protocols: secure
      ciphers: default
      tls13Ciphers: ''
      caSecret: ''
    server:
      sslmode: require
      protocols: secure
      ciphers: default
      tls13Ciphers: ''
      caSecret: ''
  poolMode: transaction
  maxClientConn: 500
  mainPoolSize: 10
  defaultPoolSize: 3
  maxDbConnections: 10
  # The server connection budget across all replicas; each replica gets an equal share.
  maxUserConnections: 80

remote: null

securityEmail: security@appsemble.com

quotas:
  appEmail:
    enabled: false
    dailyLimit: 10
    alertOrganizationOwner: false

mailpit:
  mailpit:
    smtp:
      tls:
        enabled: true
      authFile:
        enabled: true
        existingSecret:
          name: mailpit-smtp
    ui:
      authFile:
        enabled: true
        existingSecret:
          name: mailpit-ui

seaweedfs:
  enabled: true
  fullnameOverride: appsemble-seaweedfs
  global:
    seaweedfs:
      # The shared ClusterRole grants cluster-wide pod write access, which an object store does
      # not need.
      createClusterRole: false
  # One pod runs the master, volume server, filer and S3 gateway together.
  master:
    enabled: false
    # SeaweedFS keeps a separate set of volumes per bucket and grows them seven at a time, which the
    # bucket per app layout multiplies by the number of apps. One volume at a time is enough for a
    # single volume server and keeps the file count proportional to the objects stored.
    config: |-
      [master.volume_growth]
      copy_1 = 1
  volume:
    enabled: false
    # The all-in-one pod takes its volume ceiling from here. SeaweedFS grows volumes per bucket and
    # the default `0` derives the ceiling from the disk size, which a bucket per app exhausts almost
    # immediately. Volumes are created on demand and stay sparse, so a high ceiling costs nothing.
    dataDirs:
      - name: data
        maxVolumes: 2000
  filer:
    enabled: false
  allInOne:
    enabled: true
    s3:
      enabled: true
      enableAuth: true
    data:
      type: persistentVolumeClaim
      size: 8Gi
  s3:
    # The S3 gateway runs inside the all-in-one pod, so the standalone deployment stays off.
    # These settings still configure the gateway and its ingress.
    enabled: false
    enableAuth: true
    credentials:
      admin:
        existingSecret: s3
        accessKeyKey: access-key
        secretKeyKey: secret-key
    ingress:
      enabled: false
      className: nginx

valkey:
  enabled: true
  fullnameOverride: appsemble-valkey
  service:
    port: 6379
  auth:
    enabled: true
    usersExistingSecret: valkey
    aclUsers:
      default:
        permissions: '~* &* +@all'
        passwordKey: password
  resources:
    limits:
      memory: 256Mi
      cpu: 500m
    requests:
      memory: 64Mi
      cpu: 50m

externalValkey:
  host: null
  port: 6379
  username: default
  tls: false
  existingSecret: null
  passwordKey: password

backups:
  enabled: true
  bucket: appsemble-backups-exampleenv
  filename: appsemble_backup
  port: 443
  secure: true
  region: us-east-1
  pathStyle: true
  existingSecret: backups-secret
  # The scratch space each database is dumped to before it is uploaded. Must exceed the gzipped
  # dump of the largest database, or the job is evicted mid-dump.
  tmpSizeLimit: 8Gi

restoreDataFromBackup:
  enabled: false
  bucket: null
  filenamePrefix: null
  backupFilename: latest

assetsBackups:
  enabled: false
  schedule: '20 2 * * *'
  sourceEndpoint: null
  sourceRegion: fsn1
  destinationRegion: fsn1
  prefix: assets/app-buckets
  verifyAfterSync: true
  maxDelete: 2000
  checkers: 16
  transfers: 8
  archiveRetentionDays: 90
  enableMonthlyFullSnapshot: true
  fullSnapshotDay: 1
  fullSnapshotRetentionMonths: 12

prometheusRule:
  enabled: false
  labels:
    release: prometheus
