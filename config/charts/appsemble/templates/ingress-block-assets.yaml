{{- $blockAssets := default dict .Values.ingress.blockAssets -}}
{{- $cache := default dict $blockAssets.cache -}}
{{- if and .Values.ingress.enabled ($blockAssets.enabled | default false) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "appsemble.fullname" . }}-block-assets
  labels:
    {{ include "appsemble.labels" . }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{ if ($cache.enabled | default false) }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_cache {{ $cache.zone }};
      proxy_cache_key {{ $cache.key | quote }};
      proxy_cache_methods {{ $cache.methods }};
      proxy_cache_valid {{ $cache.valid }};
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
      add_header X-Appsemble-Immutable-Cache $upstream_cache_status always;
    {{ end }}
    {{ with $blockAssets.annotations }}
    {{ toYaml . | nindent 4 }}
    {{ end }}

    {{ with .Values.ingress.issuer }}
    cert-manager.io/issuer: {{ . | quote }}
    {{ end }}
    {{ with .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{ end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
{{- if .Values.ingress.tls }}
  tls:
    - hosts:
      - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
    - hosts:
      - '*.{{ .Values.ingress.host }}'
      secretName: {{ .Values.ingress.tlsWildcardSecretName }}
{{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range $blockAssets.pathPatterns }}
          - path: {{ . | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "appsemble.fullname" $ }}
                port:
                  name: http
          {{- end }}
    - host: '*.{{ .Values.ingress.host }}'
      http:
        paths:
          {{- range $blockAssets.pathPatterns }}
          - path: {{ . | quote }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "appsemble.fullname" $ }}
                port:
                  name: http
          {{- end }}
{{- end }}
