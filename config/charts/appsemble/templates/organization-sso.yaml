apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appsemble.fullname" . }}-organization-sso
  labels:
    {{ include "appsemble.labels" . }}
data:
  configuration.yaml: |
    {{- if .Values.organizationSso }}
    {{- range $organizationId, $configuration := .Values.organizationSso }}
    {{ $organizationId | quote }}:
      {{- omit $configuration "clientSecretRef" | toYaml | nindent 6 }}
      clientSecretFile: {{ printf "/run/appsemble-sso/%s/client-secret" $organizationId | quote }}
    {{- end }}
    {{- else }}
    {}
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "appsemble.fullname" . }}-organization-sso
  labels:
    {{ include "appsemble.labels" . }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: '2'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "appsemble.fullname" . }}-serviceaccount
      containers:
        - name: organization-sso
          image: "{{ .Values.image.repository }}:{{ include "appsemble.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.resources.jobs | nindent 12 }}
          args:
            - configure-organization-sso
            - --config
            - /etc/appsemble-sso/configuration.yaml
          env:
{{ include "appsemble.postgres" . | indent 12 }}
{{ include "appsemble.trustedCaBundle.env" . | indent 12 }}
            - name: AES_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretSecret | quote }}
                  key: aes-secret
          volumeMounts:
            - name: configuration
              mountPath: /etc/appsemble-sso
              readOnly: true
{{ include "appsemble.trustedCaBundle.volumeMount" . | indent 12 }}
            {{- range $organizationId, $configuration := .Values.organizationSso }}
            - name: {{ printf "sso-%s" ($organizationId | sha256sum | trunc 12) }}
              mountPath: {{ printf "/run/appsemble-sso/%s" $organizationId | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: configuration
          configMap:
            name: {{ include "appsemble.fullname" . }}-organization-sso
{{ include "appsemble.trustedCaBundle.volume" . | indent 8 }}
        {{- range $organizationId, $configuration := .Values.organizationSso }}
        - name: {{ printf "sso-%s" ($organizationId | sha256sum | trunc 12) }}
          secret:
            secretName: {{ $configuration.clientSecretRef.name | quote }}
            items:
              - key: {{ $configuration.clientSecretRef.key | quote }}
                path: client-secret
        {{- end }}
