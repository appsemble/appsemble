{{- if .Values.cronjob.platform.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "appsemble.fullname" . }}-scale-containers
  labels:
    {{ include "appsemble.labels" . }}
spec:
  schedule: "2-59/10 * * * *" # Run every 10 minutes, offset from run-cronjobs
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cronjob.jobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.jobsHistoryLimit }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: {{ .Values.cronjob.ttlSecondsAfterFinished }}
      # A run that is still active at the next ten-minute tick makes that tick skip, so a hung run
      # ends early enough for its pod to terminate before the tick.
      activeDeadlineSeconds: 480
      template:
        metadata:
          annotations:
            {{ include "appsemble.gitlab" . | indent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "appsemble.fullname" . }}-serviceaccount
          containers:
            - name: {{ include "appsemble.fullname" . }}-scale-containers
              image: "{{ .Values.image.repository }}:{{ include "appsemble.tag" . }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                readOnlyRootFilesystem: true
              resources:
                {{- toYaml .Values.resources.cronjobs | nindent 16 }}
              args:
                - scale-containers # Command that handles scaling
                - -vv
              env:
                - name: SERVICE_NAME
                  value: {{ include "appsemble.fullname" . }}
{{ include "appsemble.postgres" . | indent 16 }}
{{ end }}
