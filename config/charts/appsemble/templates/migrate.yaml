apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "appsemble.fullname" . }}-migrate
  labels:
    {{ include "appsemble.labels" . }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: '1'
    # ArgoCD cannot tell an install from an upgrade, and maps the Helm hooks above to both PreSync
    # and PostSync. PreSync runs before a first sync creates the database and secrets, so ArgoCD runs
    # the Job as a Sync hook: after earlier waves and before the Deployment in wave 1.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '0'
spec:
  template:
    metadata:
      annotations:
        {{ include "appsemble.gitlab" . | indent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: {{ include "appsemble.fullname" . }}-migrate
          image: "{{ .Values.image.repository }}:{{ .Values.migrateImage.tag | default (include "appsemble.tag" .) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.resources.jobs | nindent 12 }}
          args:
            - migrate
            {{ with .Values.migrateTo }}
            - {{ . }}
            {{ end }}
          env:
            - name: AES_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretSecret | quote }}
                  key: aes-secret
{{ include "appsemble.postgres" . | indent 12 }}
{{ include "appsemble.s3" . | indent 12 }}
{{ include "appsemble.sentry" . | indent 12 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
