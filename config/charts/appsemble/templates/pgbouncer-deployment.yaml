{{- if .Values.pgbouncer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appsemble.pgbouncer.fullname" . }}
  labels:
    {{ include "appsemble.labels" . }}
spec:
  replicas: {{ .Values.pgbouncer.replicaCount }}
  # A replacement pod must become ready before an old one goes away, so a rollout never leaves
  # the server without a pooler.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/name: {{ include "appsemble.name" . }}-pgbouncer
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/pgbouncer-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/name: {{ include "appsemble.name" . }}-pgbouncer
    spec:
      initContainers:
        # PgBouncer authenticates clients and logs in to PostgreSQL with the credentials the server
        # uses, so its auth file is written from the same secret when the pod starts.
        - name: generate-userlist
          image: "{{ .Values.pgbouncer.image.repository }}:{{ .Values.pgbouncer.image.tag }}"
          imagePullPolicy: {{ .Values.pgbouncer.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: DATABASE_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret | quote }}
                  key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey | quote }}
          command:
            - sh
            - -ec
            - |
              # The auth file format escapes a double quote by doubling it.
              # Enclosing each field preserves trailing newlines during command substitution.
              quote() { printf '%s\n' "$1" | sed 's/"/""/g; 1s/^/"/; $s/$/"/'; }
              printf '%s %s\n' "$(quote "$DATABASE_USER")" "$(quote "$DATABASE_PASSWORD")" \
                > /etc/pgbouncer/auth/userlist.txt
          volumeMounts:
            - name: pgbouncer-auth
              mountPath: /etc/pgbouncer/auth
    {{- if and .Values.postgresSSL (include "appsemble.pgbouncer.generateTls" .) }}
      {{- $service := include "appsemble.pgbouncer.fullname" . }}
      # A certificate generated per pod keeps the rendered manifests stable: a Secret generated
      # while rendering would change with every render wherever lookup is unavailable, such as
      # under ArgoCD. The server connects with sslmode require, which does not verify it.
        - name: generate-tls
          image: "{{ .Values.image.repository }}:{{ include "appsemble.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
          command:
            - sh
            - -ec
            - |
              openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj '/CN={{ $service }}' \
                -addext 'subjectAltName=DNS:{{ $service }},DNS:{{ $service }}.{{ .Release.Namespace }},DNS:{{ $service }}.{{ .Release.Namespace }}.svc,DNS:{{ $service }}.{{ .Release.Namespace }}.svc.cluster.local' \
                -keyout /etc/pgbouncer/tls/tls.key -out /etc/pgbouncer/tls/tls.crt
              # PgBouncer runs as a different user than this container outside OpenShift.
              chmod 0644 /etc/pgbouncer/tls/tls.key
          volumeMounts:
            - name: pgbouncer-tls
              mountPath: /etc/pgbouncer/tls
    {{- end }}
      containers:
        - name: pgbouncer
          image: "{{ .Values.pgbouncer.image.repository }}:{{ .Values.pgbouncer.image.tag }}"
          imagePullPolicy: {{ .Values.pgbouncer.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - name: pgbouncer
              containerPort: {{ .Values.pgbouncer.service.port }}
          readinessProbe:
            tcpSocket:
              port: pgbouncer
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
          volumeMounts:
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: pgbouncer-auth
              mountPath: /etc/pgbouncer/auth
              readOnly: true
            # PgBouncer creates its unix socket in /tmp, which needs to be writable with the
            # read-only root filesystem.
            - name: tmp
              mountPath: /tmp
          {{- if .Values.postgresSSL }}
            - name: pgbouncer-tls
              mountPath: /etc/pgbouncer/tls
              readOnly: true
          {{- with .Values.pgbouncer.tls.client.caSecret }}
            - name: pgbouncer-client-ca
              mountPath: /etc/pgbouncer/client-ca
              readOnly: true
          {{- end }}
          {{- with .Values.pgbouncer.tls.server.caSecret }}
            - name: pgbouncer-server-ca
              mountPath: /etc/pgbouncer/server-ca
              readOnly: true
          {{- end }}
          {{- end }}
      # Prefer spreading the replicas across nodes, so a node failure cannot take out the pooler.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/name: {{ include "appsemble.name" . }}-pgbouncer
      volumes:
        - name: pgbouncer-config
          configMap:
            name: {{ include "appsemble.pgbouncer.fullname" . }}
        - name: pgbouncer-auth
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir: {}
      {{- if .Values.postgresSSL }}
        - name: pgbouncer-tls
        {{- if include "appsemble.pgbouncer.generateTls" . }}
          emptyDir: {}
        {{- else }}
          secret:
            secretName: {{ .Values.pgbouncer.tls.existingSecret }}
        {{- end }}
      {{- with .Values.pgbouncer.tls.client.caSecret }}
        - name: pgbouncer-client-ca
          secret:
            secretName: {{ . }}
      {{- end }}
      {{- with .Values.pgbouncer.tls.server.caSecret }}
        - name: pgbouncer-server-ca
          secret:
            secretName: {{ . }}
      {{- end }}
      {{- end }}
{{- end }}
