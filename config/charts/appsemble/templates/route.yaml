{{- if .Values.route.enabled -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "appsemble.fullname" . }}
  labels:
    {{ include "appsemble.labels" . }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ .Values.route.host }}
  to:
    kind: Service
    name: {{ include "appsemble.fullname" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: {{ .Values.route.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy }}
  # This Route serves the exact host only. A Subdomain policy here would claim every sibling host
  # (`*.<parent domain>`) for this namespace: unrelated hosts would reach Appsemble, and OpenShift
  # would reject Routes for those hosts in other namespaces.
  wildcardPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "appsemble.fullname" . }}-wildcard
  labels:
    {{ include "appsemble.labels" . }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # OpenShift rejects `*` in a Route host. With the Subdomain policy, the host `wildcard.<host>`
  # serves `*.<host>`, one label deep: the organization hosts below the main host.
  host: {{ printf "wildcard.%s" .Values.route.host | quote }}
  to:
    kind: Service
    name: {{ include "appsemble.fullname" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: {{ .Values.route.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy }}
  wildcardPolicy: Subdomain
{{- end }}
