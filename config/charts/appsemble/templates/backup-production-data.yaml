{{- if and .Values.cronjob.platform.enabled .Values.backups.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "appsemble.fullname" . }}-backup-production-data
  labels:
    {{ include "appsemble.labels" . }}
spec:
  schedule: 0 1 * * * # Run every day at 01:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cronjob.jobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.jobsHistoryLimit }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: {{ .Values.cronjob.ttlSecondsAfterFinished }}
      backoffLimit: 2
      # A clean run takes about half an hour; the per-database retries make a run against an
      # unreachable object store take days, so bound the Job instead of letting it overlap the
      # next night.
      activeDeadlineSeconds: 21600
      template:
        metadata:
          annotations:
            {{ include "appsemble.gitlab" . | indent 12 }}
        spec:
          restartPolicy: Never
          containers:
            - name: {{ include "appsemble.fullname" . }}-cronjob-backup-production-data
              image: "{{ .Values.image.repository }}:{{ include "appsemble.tag" . }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                readOnlyRootFilesystem: true
              resources:
                {{- toYaml .Values.resources.backupCronjob | nindent 16 }}
              args:
                - backup-production-data
                - -vv
              env:
                - name: AES_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretSecret | quote }}
                      key: aes-secret
{{ include "appsemble.postgres" . | indent 16 }}
{{ include "appsemble.backups" . | indent 16 }}
              volumeMounts:
                - name: tmp-volume
                  mountPath: /tmp
          volumes:
            # Each database is dumped here before it is uploaded.
            - name: tmp-volume
              emptyDir:
                sizeLimit: {{ .Values.backups.tmpSizeLimit }}
{{ end }}
