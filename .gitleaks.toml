[extend]
useDefault = true

[[allowlists]]
description = "Local development secrets in package.json"
paths = ["package.json"]
regexTarget = "line"
regexes = [
  '''github-client-secret''',
  '''gitlab-client-secret''',
  '''"secret"''',
  '''"aes-secret"''',
  '''s3-access-key''',
  '''s3-secret-key''',
]

[[allowlists]]
description = "Placeholder PEM keys in tests"
paths = ['''.*\.test\.tsx?$''']
regexTarget = "line"
regexes = ['''-----BEGIN PRIVATE KEY-----\\n[A-Z]{2,3}\\n-----END PRIVATE KEY-----''']
