# The secret detection job downloads the artifacts of earlier jobs. Skip the build output and
# installed dependencies among them; the repository's own files stay scanned.
[secrets]
  [[secrets.passthrough]]
    type = "raw"
    target = "gitleaks.toml"
    value = """
[extend]
path = "/gitleaks.toml"

[allowlist]
description = "Build output and installed dependencies"
paths = ['''(^|/)dist/''', '''(^|/)node_modules/''']
"""
