services:
  # A persistent database for local development.
  postgres-dev:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: appsemble
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: pgbouncer
    restart: always
    depends_on:
      - postgres-dev
    ports:
      - '6432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt

  # A database using tmpfs for faster test runs.
  postgres-test:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: appsemble
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - '54321:5432'
    tmpfs:
      - /var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: info@appsemble.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - '2345:80'

  # Object storage for assets, matching the store the Helm chart bundles.
  s3:
    image: chrislusf/seaweedfs:4.47
    restart: always
    entrypoint: ['sh', '-ec']
    command:
      - |
        cat > /etc/seaweedfs/s3.json <<'JSON'
        {
          "identities": [
            {
              "name": "admin",
              "credentials": [{ "accessKey": "admin", "secretKey": "password" }],
              "actions": ["Admin", "Read", "Write"]
            }
          ]
        }
        JSON
        exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -volume.max=2000
    ports:
      - '8333:8333'
    volumes:
      - s3:/data

  # Object storage for faster test runs.
  s3-test:
    image: chrislusf/seaweedfs:4.47
    restart: always
    entrypoint: ['sh', '-ec']
    command:
      - |
        cat > /etc/seaweedfs/s3.json <<'JSON'
        {
          "identities": [
            {
              "name": "admin",
              "credentials": [{ "accessKey": "admin", "secretKey": "password" }],
              "actions": ["Admin", "Read", "Write"]
            }
          ]
        }
        JSON
        exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -volume.max=2000
    ports:
      - '9009:8333'
    volumes:
      - s3-test:/data

  # A persistent Valkey instance for local development.
  valkey-dev:
    image: valkey/valkey:9.1.2
    restart: always
    command: valkey-server --requirepass password
    ports:
      - '6379:6379'

  # A Valkey instance for faster test runs.
  valkey-test:
    image: valkey/valkey:9.1.2
    restart: always
    command: valkey-server --requirepass password
    ports:
      - '63791:6379'

volumes:
  s3:
  s3-test:
